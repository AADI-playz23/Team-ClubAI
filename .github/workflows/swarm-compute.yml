name: TeamClubAI Swarm Compute

on:
  workflow_dispatch:
    inputs:
      job_type:
        description: 'Type of job: "llm" or "python"'
        required: true
      payload:
        description: 'Prompt or Python Code'
        required: true

permissions:
  contents: write

jobs:
  compute-node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Tier Inference (C++ / llama.cpp)
        if: ${{ github.event.inputs.job_type == 'llm' }}
        run: |
          sudo apt-get install -y build-essential
          git clone https://github.com/ggerganov/llama.cpp
          cd llama.cpp && make -j2
          wget https://huggingface.co/microsoft/Phi-3-mini-4k-instruct-gguf/resolve/main/Phi-3-mini-4k-instruct-q4.gguf -O phi3.gguf
          ./main -m phi3.gguf -p "${{ github.event.inputs.payload }}" -n 512 > ../output.txt

      - name: Python Action Tunnel
        if: ${{ github.event.inputs.job_type == 'python' }}
        run: |
          cat << 'EOF' > script.py
          ${{ github.event.inputs.payload }}
          EOF
          python3 script.py > output.txt 2>&1

      - name: Save Results to Repo
        run: |
          mkdir -p db
          mv output.txt db/latest_result.txt
          git config --global user.name "TeamClubAI-Bot"
          git config --global user.email "bot@teamclub.ai"
          git add db/latest_result.txt
          git commit -m "Automated Swarm Result"
          git push origin main
