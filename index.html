<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamClubAI | Heterogeneous Multi-Agent Workspace</title>
    <style>
        :root {
            --bg-color: #0f111a;
            --panel-bg: rgba(25, 28, 41, 0.7);
            --accent: #7c3aed;
            --accent-hover: #6d28d9;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --success: #10b981;
            --error: #ef4444;
            --gemini-color: #4285F4;
            --openai-color: #10a37f;
            --groq-color: #f55036;
            --openrouter-color: #a855f7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top right, #2e1065, transparent 40%),
                              radial-gradient(circle at bottom left, #172554, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header { display: flex; justify-content: space-between; align-items: center; }
        header h1 { color: #fff; font-size: 2rem; margin-bottom: 5px; }
        header h1 span { color: var(--accent); }
        header p { color: var(--text-muted); }

        input[type="password"], input[type="text"], textarea {
            flex: 1; width: 100%; padding: 12px; background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: #fff;
            outline: none; transition: border-color 0.3s; font-size: 1rem;
        }
        input[type="password"]:focus, input[type="text"]:focus, textarea:focus { border-color: var(--accent); }

        button {
            background: var(--accent); color: white; border: none; padding: 12px 24px;
            border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s ease; white-space: nowrap;
        }
        button:hover { background: var(--accent-hover); }
        button:disabled { background: var(--text-muted); cursor: not-allowed; }
        button.danger { background: transparent; border: 1px solid var(--error); color: var(--error); }
        button.danger:hover { background: rgba(239, 68, 68, 0.1); }

        #notification {
            display: none; padding: 10px; border-radius: 8px; text-align: center;
            font-weight: bold; font-size: 0.9rem; margin-bottom: 10px;
        }

        .main-workspace { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        @media (max-width: 768px) {
            .main-workspace { grid-template-columns: 1fr; }
            .container { padding: 15px; }
            header { flex-direction: column; align-items: flex-start; gap: 10px; }
        }

        .chat-section { display: flex; flex-direction: column; gap: 15px; }

        .chat-box {
            height: 500px; overflow-y: auto; background: rgba(0, 0, 0, 0.3); border-radius: 8px;
            padding: 20px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth;
        }

        .message { padding: 15px; border-radius: 8px; line-height: 1.6; font-size: 0.95rem; animation: fadeIn 0.3s ease; }
        .message.user { background: rgba(255, 255, 255, 0.1); align-self: flex-end; max-width: 85%; }
        .message.agent { background: rgba(255, 255, 255, 0.05); border-left: 4px solid var(--accent); align-self: flex-start; max-width: 95%; }
        .message.system { background: transparent; color: var(--text-muted); text-align: center; font-style: italic; }
        
        .agent.gemini { border-left-color: var(--gemini-color); }
        .agent.openai { border-left-color: var(--openai-color); }
        .agent.groq { border-left-color: var(--groq-color); }
        .agent.openrouter { border-left-color: var(--openrouter-color); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .message pre { background: #000; padding: 12px; border-radius: 6px; overflow-x: auto; margin-top: 10px; margin-bottom: 10px; }
        .message code { font-family: monospace; color: #a5b4fc; }
        .message p { margin-bottom: 10px; }

        .input-area { display: flex; flex-direction: column; gap: 10px; }
        .input-wrapper { display: flex; gap: 10px; width: 100%; }
        textarea { height: 60px; resize: none; }
        .hidden { display: none !important; }

        .agent-status { background: rgba(0, 0, 0, 0.3); padding: 20px; border-radius: 8px; height: fit-content; }
        .agent-status h3 { margin-bottom: 15px; font-size: 1.2rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;}
        .agent-status ul { list-style: none; padding: 0; }
        .agent-status li { margin-bottom: 15px; color: var(--text-muted); padding: 12px; background: rgba(255,255,255,0.05); border-radius: 6px; transition: all 0.3s ease;}
        
        .active-agent { color: var(--success) !important; border-left: 4px solid var(--success); background: rgba(16, 185, 129, 0.1) !important; transform: translateX(5px); }
        .error-agent { color: var(--error) !important; border-left: 4px solid var(--error); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>✨ TeamClubAI <span>Workspace</span></h1>
                <p>Heterogeneous Multi-Model AI Dev Team.</p>
            </div>
            <button id="resetAppBtn" class="danger">Reset Team</button>
        </header>

        <div id="notification"></div>

        <div class="main-workspace">
            <div class="chat-section">
                <div id="chatBox" class="chat-box"></div>
                
                <div class="input-area">
                    <div class="input-wrapper">
                        <input type="text" id="singleLineInput" class="hidden" placeholder="Type here..." autocomplete="off">
                        <input type="password" id="passwordInput" class="hidden" placeholder="Paste API key here..." autocomplete="off">
                        <textarea id="taskInput" class="hidden" placeholder="Give your multi-model team a task or ask them to talk..."></textarea>
                        <button id="sendBtn">Send</button>
                    </div>
                </div>
            </div>

            <div class="agent-status" id="sidebarPanel">
                <h3 id="sidebarTitle">Active Models</h3>
                <ul id="statusList">
                    <li class="system">Complete setup to initialize models.</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const chatBox = document.getElementById("chatBox");
            const sendBtn = document.getElementById("sendBtn");
            const singleLineInput = document.getElementById("singleLineInput");
            const passwordInput = document.getElementById("passwordInput");
            const taskInput = document.getElementById("taskInput");
            const statusList = document.getElementById("statusList");
            const resetAppBtn = document.getElementById("resetAppBtn");
            const notification = document.getElementById("notification");
            const sidebarTitle = document.getElementById("sidebarTitle");

            const STAGES = { ASK_NAME: 0, ASK_COUNT: 1, ASK_PROVIDERS: 2, ASK_API_KEYS: 3, READY: 4 };

            let appState = {
                stage: STAGES.ASK_NAME,
                userName: "",
                memberCount: 0,
                agents: [], 
                uniqueProvidersNeeded: [],
                apiKeys: {}, 
                setupIndices: { currentAgentIndex: 0, currentKeyIndex: 0 },
                chatHistory: [] 
            };

            const savedState = localStorage.getItem("teamclubai_state");
            if (savedState) appState = JSON.parse(savedState);

            renderUIBasedOnStage();

            sendBtn.addEventListener("click", handleUserInput);
            
            [singleLineInput, passwordInput, taskInput].forEach(inputEl => {
                inputEl.addEventListener("keypress", (e) => {
                    if (e.key === "Enter" && !e.shiftKey) {
                        e.preventDefault();
                        handleUserInput();
                    }
                });
            });

            resetAppBtn.addEventListener("click", () => {
                if(confirm("Warning: This will delete your team config and API keys from browser memory. Proceed?")) {
                    localStorage.removeItem("teamclubai_state");
                    location.reload();
                }
            });

            async function handleUserInput() {
                let activeInput = null;
                if (!singleLineInput.classList.contains("hidden")) activeInput = singleLineInput;
                else if (!passwordInput.classList.contains("hidden")) activeInput = passwordInput;
                else if (!taskInput.classList.contains("hidden")) activeInput = taskInput;

                const inputVal = activeInput.value.trim();
                if (!inputVal) return;
                activeInput.value = ""; 

                if (appState.stage !== STAGES.ASK_API_KEYS) {
                    addMessageToUI(appState.userName || "User", inputVal, "user");
                } else {
                    addMessageToUI(appState.userName, "••••••••••••••••", "user");
                }

                switch (appState.stage) {
                    case STAGES.ASK_NAME:
                        appState.userName = inputVal;
                        appState.stage = STAGES.ASK_COUNT;
                        saveState();
                        setTimeout(() => {
                            addMessageToUI("System", `Welcome, **${appState.userName}**. How many AI models do you want in this conversation? (Enter a number between 2 and 5)`, "system");
                            renderUIBasedOnStage();
                        }, 500);
                        break;

                    case STAGES.ASK_COUNT:
                        const count = parseInt(inputVal);
                        if (isNaN(count) || count < 2 || count > 5) {
                            setTimeout(() => addMessageToUI("System", "Please enter a valid number between **2 and 5**.", "system"), 500);
                        } else {
                            appState.memberCount = count;
                            appState.stage = STAGES.ASK_PROVIDERS;
                            appState.setupIndices.currentAgentIndex = 0;
                            saveState();
                            setTimeout(() => { askForNextProvider(); }, 500);
                        }
                        break;

                    case STAGES.ASK_PROVIDERS:
                        let providerID = "", providerName = "";
                        if (inputVal === "1") { providerID = "gemini"; providerName = "Google Gemini"; }
                        else if (inputVal === "2") { providerID = "openai"; providerName = "OpenAI"; }
                        else if (inputVal === "3") { providerID = "groq"; providerName = "Groq (Llama 3)"; }
                        else if (inputVal === "4") { providerID = "openrouter"; providerName = "OpenRouter"; }
                        else {
                            setTimeout(() => addMessageToUI("System", "Invalid choice. Please type 1, 2, 3, or 4.", "system"), 500);
                            return;
                        }

                        appState.agents.push({
                            id: appState.setupIndices.currentAgentIndex + 1,
                            provider: providerID,
                            providerName: providerName
                        });

                        appState.setupIndices.currentAgentIndex++;
                        
                        if (appState.setupIndices.currentAgentIndex < appState.memberCount) {
                            saveState();
                            setTimeout(() => askForNextProvider(), 500);
                        } else {
                            appState.uniqueProvidersNeeded = [...new Set(appState.agents.map(a => a.provider))];
                            appState.stage = STAGES.ASK_API_KEYS;
                            appState.setupIndices.currentKeyIndex = 0;
                            saveState();
                            setTimeout(() => askForNextKey(), 500);
                        }
                        break;

                    case STAGES.ASK_API_KEYS:
                        const currentProviderToKey = appState.uniqueProvidersNeeded[appState.setupIndices.currentKeyIndex];
                        appState.apiKeys[currentProviderToKey] = inputVal;
                        appState.setupIndices.currentKeyIndex++;

                        if (appState.setupIndices.currentKeyIndex < appState.uniqueProvidersNeeded.length) {
                            saveState();
                            setTimeout(() => askForNextKey(), 500);
                        } else {
                            appState.stage = STAGES.READY;
                            saveState();
                            setTimeout(() => {
                                addMessageToUI("System", `Models Initialized! 🎉<br><br>Your team is ready. Try typing: *"Say hello to each other and introduce yourselves."*`, "system");
                                renderUIBasedOnStage();
                            }, 500);
                        }
                        break;

                    case STAGES.READY:
                        appState.chatHistory.push({ sender: appState.userName, text: inputVal });
                        saveState();
                        await runMultiAgentTeam(inputVal);
                        break;
                }
            }

            function askForNextProvider() {
                const agentNum = appState.setupIndices.currentAgentIndex + 1;
                addMessageToUI("System", `Which API should power **Agent ${agentNum}**?<br>Type the number:<br>1. Google Gemini<br>2. OpenAI (ChatGPT)<br>3. Groq (Llama 3)<br>4. OpenRouter`, "system");
                renderUIBasedOnStage();
            }

            function askForNextKey() {
                const providerID = appState.uniqueProvidersNeeded[appState.setupIndices.currentKeyIndex];
                let friendlyName = providerID.charAt(0).toUpperCase() + providerID.slice(1);
                addMessageToUI("System", `Please securely paste your **${friendlyName} API Key**:`, "system");
                renderUIBasedOnStage();
            }

            async function runMultiAgentTeam(task) {
                sendBtn.disabled = true;
                taskInput.disabled = true;

                try {
                    let currentContext = `User Request: ${task}\n\n`;
                    let lastOutput = "";

                    for (let i = 0; i < appState.agents.length; i++) {
                        const currentAgent = appState.agents[i];
                        const agentDisplayName = `Agent ${currentAgent.id} (${currentAgent.providerName})`;
                        const apiKey = appState.apiKeys[currentAgent.provider];
                        
                        updateStatus(currentAgent.id, "Generating...");

                        let systemPrompt = `You are an AI model powered by ${currentAgent.providerName}. You are acting as Agent ${currentAgent.id} in a team of ${appState.agents.length} AI models. Respond organically to the user's prompt or the conversation generated by your fellow AI models. Embrace your true identity as ${currentAgent.providerName}.`;
                        
                        let userPrompt = `Here is the original User Request: "${task}"\n\n`;
                        if (i > 0) {
                            userPrompt += `Here is the conversation so far from your fellow AI team members:\n${currentContext}\n\nPlease add your perspective, output, or critique.`;
                        } else {
                            userPrompt += `Please start the task or conversation.`;
                        }

                        const agentResponse = await callAIAPI(currentAgent.provider, apiKey, userPrompt, systemPrompt);
                        
                        addMessageToUI(agentDisplayName, agentResponse, `agent ${currentAgent.provider}`);
                        appState.chatHistory.push({ sender: agentDisplayName, text: agentResponse, cssClass: `agent ${currentAgent.provider}` });
                        saveState();

                        lastOutput = agentResponse;
                        currentContext += `--- Response from ${agentDisplayName} ---\n${agentResponse}\n\n`;
                        
                        updateStatus(currentAgent.id, "Waiting");
                        await new Promise(res => setTimeout(res, 1200));
                    }
                    
                    showNotification("Turn complete.", "success");

                } catch (error) {
                    showNotification(`Error: ${error.message}`, "error");
                    resetAllStatuses();
                } finally {
                    sendBtn.disabled = false;
                    taskInput.disabled = false;
                    taskInput.focus();
                }
            }

            // --- Multi-Provider Universal API Caller with max_tokens Fix ---
            async function callAIAPI(provider, apiKey, prompt, systemInstruction) {
                if (provider === "gemini") {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
                    const payload = { 
                        contents: [{ parts: [{ text: prompt }] }], 
                        systemInstruction: { parts: [{ text: systemInstruction }] },
                        generationConfig: { maxOutputTokens: 1000 } 
                    };
                    
                    const response = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
                    if (!response.ok) throw new Error(`Gemini API Error: ${response.status}`);
                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text || "No response generated.";
                } 
                else {
                    let url = "", modelName = "";

                    if (provider === "openai") {
                        url = "https://api.openai.com/v1/chat/completions";
                        modelName = "gpt-4o-mini"; 
                    } else if (provider === "groq") {
                        url = "https://api.groq.com/openai/v1/chat/completions";
                        modelName = "llama3-8b-8192"; 
                    } else if (provider === "openrouter") {
                        url = "https://openrouter.ai/api/v1/chat/completions";
                        modelName = "google/gemini-2.5-flash"; 
                    }

                    const response = await fetch(url, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": `Bearer ${apiKey}`,
                            "HTTP-Referer": "https://AADI-playz23.github.io/Team-ClubAI/", 
                            "X-Title": "TeamClubAI"
                        },
                        body: JSON.stringify({
                            model: modelName,
                            max_tokens: 1000, // Cost reservation fix for OpenRouter
                            messages: [
                                { role: "system", content: systemInstruction },
                                { role: "user", content: prompt }
                            ]
                        })
                    });

                    if (!response.ok) {
                        const err = await response.json();
                        throw new Error(err.error?.message || `${provider} API Error: ${response.status}`);
                    }
                    const data = await response.json();
                    return data.choices[0].message.content;
                }
            }

            function renderUIBasedOnStage() {
                singleLineInput.classList.add("hidden");
                passwordInput.classList.add("hidden");
                taskInput.classList.add("hidden");

                if (appState.stage === STAGES.ASK_NAME || appState.stage === STAGES.ASK_COUNT || appState.stage === STAGES.ASK_PROVIDERS) {
                    singleLineInput.classList.remove("hidden");
                    singleLineInput.placeholder = "Type your response...";
                    singleLineInput.focus();
                    if(appState.stage === STAGES.ASK_NAME && chatBox.children.length === 0) {
                        addMessageToUI("System", "Welcome to TeamClubAI Multi-Model Workspace! 🚀<br><br>Let's configure your models. What is your name?", "system");
                    }
                } 
                else if (appState.stage === STAGES.ASK_API_KEYS) {
                    passwordInput.classList.remove("hidden");
                    passwordInput.focus();
                } 
                else if (appState.stage === STAGES.READY) {
                    taskInput.classList.remove("hidden");
                    taskInput.focus();
                    renderSidebar();
                    
                    if(chatBox.children.length === 0) {
                        addMessageToUI("System", `Workspace Restored. Welcome back, **${appState.userName}**.`, "system");
                        appState.chatHistory.forEach(msg => addMessageToUI(msg.sender, msg.text, msg.cssClass || (msg.sender === appState.userName ? "user" : "agent")));
                    }
                }
            }

            function renderSidebar() {
                sidebarTitle.innerText = `${appState.userName}'s Network`;
                statusList.innerHTML = "";
                appState.agents.forEach((agent) => {
                    const li = document.createElement("li");
                    li.id = `agent-status-${agent.id}`;
                    li.innerHTML = `🤖 <strong>Agent ${agent.id}</strong><br><small style="color:var(--${agent.provider}-color)">${agent.providerName}</small><br><span>Idle</span>`;
                    statusList.appendChild(li);
                });
            }

            function updateStatus(agentId, statusText) {
                const el = document.getElementById(`agent-status-${agentId}`);
                if(!el) return;
                el.querySelector('span').innerText = statusText;
                el.classList.remove("active-agent", "error-agent");
                if (statusText === "Generating...") el.classList.add("active-agent");
            }

            function resetAllStatuses() {
                appState.agents.forEach((a) => updateStatus(a.id, "Idle"));
            }

            function showNotification(message, type) {
                notification.innerHTML = message;
                notification.style.display = "block";
                notification.style.backgroundColor = type === "success" ? "rgba(16, 185, 129, 0.2)" : "rgba(239, 68, 68, 0.2)";
                notification.style.color = type === "success" ? "var(--success)" : "var(--error)";
                notification.style.border = `1px solid ${type === "success" ? "var(--success)" : "var(--error)"}`;
                setTimeout(() => notification.style.display = "none", 4000);
            }

            function saveState() {
                if(appState.chatHistory.length > 30) appState.chatHistory = appState.chatHistory.slice(-30);
                localStorage.setItem("teamclubai_state", JSON.stringify(appState));
            }

            function addMessageToUI(sender, text, type) {
                const msgDiv = document.createElement("div");
                msgDiv.className = `message ${type}`;
                let formattedText = text
                    .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>') 
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') 
                    .replace(/\*(.*?)\*/g, '<em>$1</em>') 
                    .replace(/\n/g, '<br>'); 
                msgDiv.innerHTML = `<strong>${sender}:</strong><br><br>${formattedText}`;
                chatBox.appendChild(msgDiv);
                chatBox.scrollTop = chatBox.scrollHeight; 
            }
        });
    </script>
</body>
</html>
