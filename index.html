<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamClubAI - Autonomous Agency</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* --- 1. Visual Aesthetic & Cyberpunk Glassmorphism --- */
        :root {
            --bg-dark: #0f111a;
            --glass-bg: rgba(20, 22, 35, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --neon-purple: #9d4edd;
            --neon-blue: #00f0ff;
            --neon-red: #ff3366;
            --text-main: #e2e8f0;
        }

        body {
            margin: 0;
            background: radial-gradient(circle at top left, #240046, var(--bg-dark) 40%);
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, sans-serif;
            height: 100vh;
            overflow: hidden; /* Prevents whole page scroll */
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .flex-center { justify-content: center; align-items: center; }

        .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .neon-text { color: var(--text-main); text-shadow: 0 0 10px rgba(157, 78, 221, 0.5); margin: 0; }

        /* --- 2. Layout Structure (CSS Grid) --- */
        .main-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            flex: 1;
            overflow: hidden; /* Crucial for internal chat scrolling */
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 20px;
        }

        .setup-box { width: 100%; max-width: 400px; text-align: center; }
        .setup-form { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; text-align: left; }

        .workspace {
            display: flex;
            flex-direction: column;
            height: 100%;
            box-sizing: border-box;
        }

        /* --- 3. CHAT SCROLL FIX --- */
        .chat-box {
            flex: 1;
            overflow-y: auto; /* Forces scrolling inside this container only */
            padding-right: 15px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .chat-box::-webkit-scrollbar { width: 6px; }
        .chat-box::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 4px; }

        /* --- Chat Messages --- */
        .msg-bubble {
            padding: 12px 18px;
            border-radius: 8px;
            max-width: 80%;
            line-height: 1.5;
            animation: slideUp 0.3s ease-out;
        }
        .system { background: rgba(157, 78, 221, 0.1); border-left: 3px solid var(--neon-purple); align-self: flex-start; }
        .user { background: rgba(255, 255, 255, 0.05); align-self: flex-end; }
        .error { background: rgba(255, 51, 102, 0.1); border-left: 3px solid var(--neon-red); align-self: center; }
        .agent-Proposer { background: rgba(0, 240, 255, 0.1); border-left: 3px solid var(--neon-blue); align-self: flex-start;}
        .agent-Critic { background: rgba(255, 165, 0, 0.1); border-left: 3px solid orange; align-self: flex-start;}
        .agent-Synthesizer { background: rgba(57, 255, 20, 0.1); border-left: 3px solid #39ff14; align-self: flex-start;}
        .agent-Security { background: rgba(255, 255, 0, 0.1); border-left: 3px solid yellow; align-self: flex-start;}
        .agent-Optimizer { background: rgba(255, 0, 255, 0.1); border-left: 3px solid magenta; align-self: flex-start;}

        /* --- Inputs & Buttons --- */
        .input-area { display: flex; gap: 10px; }
        input {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus { border-color: var(--neon-purple); }

        button {
            padding: 15px 25px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary { background: var(--neon-purple); color: white; }
        .btn-primary:hover { box-shadow: 0 0 15px rgba(157, 78, 221, 0.5); }
        .btn-danger { background: var(--neon-red); color: white; }
        .btn-danger-outline { background: transparent; border: 1px solid var(--neon-red); color: var(--neon-red); padding: 8px 15px;}

        /* --- Sidebar --- */
        .agent-card {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--glass-border);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: border-color 0.3s;
        }
        .agent-card.active { border-color: var(--neon-blue); }
        .status-dot {
            display: inline-block;
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #555;
            margin-right: 8px;
        }
        .status-dot.pulse {
            background: var(--neon-blue);
            box-shadow: 0 0 8px var(--neon-blue);
            animation: pulse 1s infinite;
        }

        /* --- Animations --- */
        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            // --- State Management ---
            const [setupStep, setSetupStep] = useState(0);
            const [userName, setUserName] = useState("");
            const [teamSize, setTeamSize] = useState(3);
            const [agents, setAgents] = useState([]);
            
            const [messages, setMessages] = useState([]);
            const [inputValue, setInputValue] = useState("");
            const [isDebating, setIsDebating] = useState(false);

            // The secret to perfect chat scrolling
            const chatEndRef = useRef(null);

            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
            }, [messages]);

            // --- Handlers ---
            const addMessage = (text, sender) => {
                setMessages(prev => [...prev, { id: Date.now() + Math.random(), text, sender }]);
            };

            const handleSetupSubmit = (e) => {
                e.preventDefault();
                if (setupStep === 0 && userName.trim()) {
                    setSetupStep(1);
                } else if (setupStep === 1) {
                    if (teamSize >= 2 && teamSize <= 5) {
                        const roles = ["Proposer", "Critic", "Synthesizer", "Security", "Optimizer"];
                        const newAgents = Array.from({ length: teamSize }, (_, i) => ({
                            id: i + 1,
                            role: roles[i],
                            status: "Idle"
                        }));
                        setAgents(newAgents);
                        setSetupStep(2); 
                        addMessage(`Welcome, ${userName}. Your ${teamSize}-agent debate council is initialized. What would you like us to build?`, 'system');
                    } else {
                        alert("Please enter a number between 2 and 5.");
                    }
                }
            };

            const triggerDebateLoop = async (task) => {
                setIsDebating(true);
                addMessage(task, 'user');
                setInputValue("");

                // Simulate the Debate Loop across the active agents
                for (let i = 0; i < agents.length; i++) {
                    if (!isDebating) break; 
                    
                    const agent = agents[i];
                    
                    // Set status to Debating
                    setAgents(prev => prev.map(a => a.id === agent.id ? { ...a, status: "Debating..." } : a));
                    
                    // Simulate API Processing Time
                    await new Promise(resolve => setTimeout(resolve, 1500));
                    
                    // Mock debate responses based on role
                    let responseText = "";
                    if (agent.role === "Proposer") responseText = `I propose we structure the solution this way to meet the user's goal...`;
                    else if (agent.role === "Critic") responseText = `I disagree with the Proposer's approach. We need to consider these edge cases...`;
                    else if (agent.role === "Synthesizer") responseText = `Merging both ideas. Here is the final, optimized execution plan...`;
                    else responseText = `Analyzing the output for ${agent.role} protocols... looks good.`;

                    addMessage(`[${agent.role}]: ${responseText}`, `agent-${agent.role}`);

                    // Reset status
                    setAgents(prev => prev.map(a => a.id === agent.id ? { ...a, status: "Idle" } : a));
                }
                
                if(isDebating) {
                    setIsDebating(false);
                    addMessage("Debate concluded. The optimal solution has been generated.", 'system');
                }
            };

            const handleChatSubmit = (e) => {
                e.preventDefault();
                if (!inputValue.trim() || isDebating) return;
                triggerDebateLoop(inputValue);
            };

            const emergencyStop = () => {
                setIsDebating(false);
                setAgents(prev => prev.map(a => ({ ...a, status: "Idle" })));
                addMessage("System: Debate forcefully halted by user.", 'error');
            };

            // --- Render Logic ---
            if (setupStep < 2) {
                return (
                    <div className="app-container flex-center fade-in">
                        <div className="glass-panel setup-box">
                            <h1 className="neon-text">Initialize Swarm</h1>
                            <form onSubmit={handleSetupSubmit} className="setup-form">
                                {setupStep === 0 ? (
                                    <React.Fragment>
                                        <label>What is your name, Commander?</label>
                                        <input 
                                            type="text" 
                                            autoFocus
                                            value={userName} 
                                            onChange={(e) => setUserName(e.target.value)} 
                                            placeholder="e.g., Aadi" 
                                        />
                                    </React.Fragment>
                                ) : (
                                    <React.Fragment>
                                        <label>How many AI debaters do you want? (2-5)</label>
                                        <input 
                                            type="number" 
                                            min="2" max="5"
                                            autoFocus
                                            value={teamSize} 
                                            onChange={(e) => setTeamSize(parseInt(e.target.value))} 
                                        />
                                    </React.Fragment>
                                )}
                                <button type="submit" className="btn-primary">Next</button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="app-container fade-in">
                    <header className="app-header">
                        <h2 className="neon-text">{userName}'s AI Council</h2>
                        <button className="btn-danger-outline" onClick={() => window.location.reload()}>Reboot</button>
                    </header>

                    <main className="main-grid">
                        <section className="glass-panel workspace">
                            <div className="chat-box">
                                {messages.map((msg) => (
                                    <div key={msg.id} className={`msg-bubble ${msg.sender}`}>
                                        {msg.text}
                                    </div>
                                ))}
                                {/* The Invisible Div that catches the scroll */}
                                <div ref={chatEndRef} /> 
                            </div>

                            <form onSubmit={handleChatSubmit} className="input-area">
                                <input 
                                    type="text" 
                                    value={inputValue}
                                    onChange={(e) => setInputValue(e.target.value)}
                                    placeholder="Give the council a task..."
                                    disabled={isDebating}
                                />
                                {isDebating ? (
                                    <button type="button" className="btn-danger" onClick={emergencyStop}>Stop Debate</button>
                                ) : (
                                    <button type="submit" className="btn-primary">Deploy</button>
                                )}
                            </form>
                        </section>

                        <aside className="glass-panel">
                            <h3 style={{marginTop: 0, borderBottom: "1px solid var(--glass-border)", paddingBottom: "10px"}}>Council Status</h3>
                            <div>
                                {agents.map(agent => (
                                    <div key={agent.id} className={`agent-card ${agent.status !== 'Idle' ? 'active' : ''}`}>
                                        <div style={{fontWeight: "bold", color: "var(--neon-purple)"}}>{agent.role}</div>
                                        <div style={{fontSize: "13px", marginTop: "8px", display: "flex", alignItems: "center"}}>
                                            <span className={`status-dot ${agent.status !== 'Idle' ? 'pulse' : ''}`}></span>
                                            {agent.status}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </aside>
                    </main>
                </div>
            );
        }

        // Render the App to the DOM
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
