<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamClubAI | Autonomous Swarm with User Check-in</title>
    <style>
        :root {
            --bg-color: #0f111a;
            --panel-bg: rgba(25, 28, 41, 0.7);
            --accent: #7c3aed;
            --accent-hover: #6d28d9;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --success: #10b981;
            --error: #ef4444;
            --gemini-color: #4285F4;
            --openai-color: #10a37f;
            --groq-color: #f55036;
            --openrouter-color: #a855f7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top right, #2e1065, transparent 40%),
                              radial-gradient(circle at bottom left, #172554, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header { display: flex; justify-content: space-between; align-items: center; }
        header h1 { color: #fff; font-size: 2rem; margin-bottom: 5px; }
        header h1 span { color: var(--accent); }
        header p { color: var(--text-muted); }

        input[type="password"], input[type="text"], textarea {
            flex: 1; width: 100%; padding: 12px; background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: #fff;
            outline: none; transition: border-color 0.3s; font-size: 1rem;
        }
        input[type="password"]:focus, input[type="text"]:focus, textarea:focus { border-color: var(--accent); }

        button {
            background: var(--accent); color: white; border: none; padding: 12px 24px;
            border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s ease; white-space: nowrap;
        }
        button:hover { background: var(--accent-hover); }
        button:disabled { background: var(--text-muted); cursor: not-allowed; }
        button.danger { background: rgba(239, 68, 68, 0.2); border: 1px solid var(--error); color: var(--error); }
        button.danger:hover { background: rgba(239, 68, 68, 0.4); }

        #notification {
            display: none; padding: 10px; border-radius: 8px; text-align: center;
            font-weight: bold; font-size: 0.9rem; margin-bottom: 10px;
        }

        .main-workspace { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        @media (max-width: 768px) {
            .main-workspace { grid-template-columns: 1fr; }
            .container { padding: 15px; }
            header { flex-direction: column; align-items: flex-start; gap: 10px; }
        }

        .chat-section { display: flex; flex-direction: column; gap: 15px; }

        .chat-box {
            height: 500px; overflow-y: auto; background: rgba(0, 0, 0, 0.3); border-radius: 8px;
            padding: 20px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth;
        }

        .message { padding: 15px; border-radius: 8px; line-height: 1.6; font-size: 0.95rem; animation: fadeIn 0.3s ease; }
        .message.user { background: rgba(255, 255, 255, 0.1); align-self: flex-end; max-width: 85%; }
        .message.agent { background: rgba(255, 255, 255, 0.05); border-left: 4px solid var(--accent); align-self: flex-start; max-width: 95%; }
        .message.system { background: transparent; color: var(--text-muted); text-align: center; font-style: italic; }
        
        .agent.gemini { border-left-color: var(--gemini-color); }
        .agent.openai { border-left-color: var(--openai-color); }
        .agent.groq { border-left-color: var(--groq-color); }
        .agent.openrouter { border-left-color: var(--openrouter-color); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .message pre { background: #000; padding: 12px; border-radius: 6px; overflow-x: auto; margin-top: 10px; margin-bottom: 10px; }
        .message code { font-family: monospace; color: #a5b4fc; }
        .message p { margin-bottom: 10px; }

        .input-area { display: flex; flex-direction: column; gap: 10px; }
        .input-wrapper { display: flex; gap: 10px; width: 100%; }
        textarea { height: 60px; resize: none; }
        .hidden { display: none !important; }

        .agent-status { background: rgba(0, 0, 0, 0.3); padding: 20px; border-radius: 8px; height: fit-content; }
        .agent-status h3 { margin-bottom: 15px; font-size: 1.2rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;}
        .agent-status ul { list-style: none; padding: 0; }
        .agent-status li { margin-bottom: 15px; color: var(--text-muted); padding: 12px; background: rgba(255,255,255,0.05); border-radius: 6px; transition: all 0.3s ease;}
        
        .active-agent { color: var(--success) !important; border-left: 4px solid var(--success); background: rgba(16, 185, 129, 0.1) !important; transform: translateX(5px); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>✨ TeamClubAI <span>Interactive</span></h1>
                <p>Heterogeneous AI Swarm with User Control.</p>
            </div>
            <button id="resetAppBtn" class="danger">Reset Config</button>
        </header>

        <div id="notification"></div>

        <div class="main-workspace">
            <div class="chat-section">
                <div id="chatBox" class="chat-box"></div>
                
                <div class="input-area">
                    <div class="input-wrapper">
                        <input type="text" id="singleLineInput" class="hidden" placeholder="Type here..." autocomplete="off">
                        <input type="password" id="passwordInput" class="hidden" placeholder="Paste API key here..." autocomplete="off">
                        <textarea id="taskInput" class="hidden" placeholder="Give your team a task..."></textarea>
                        
                        <button id="sendBtn">Send</button>
                        <button id="stopBtn" class="danger hidden">Stop Swarm</button>
                    </div>
                </div>
            </div>

            <div class="agent-status" id="sidebarPanel">
                <h3 id="sidebarTitle">Active Models</h3>
                <ul id="statusList">
                    <li class="system">Complete setup to initialize models.</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const chatBox = document.getElementById("chatBox");
            const sendBtn = document.getElementById("sendBtn");
            const stopBtn = document.getElementById("stopBtn");
            const singleLineInput = document.getElementById("singleLineInput");
            const passwordInput = document.getElementById("passwordInput");
            const taskInput = document.getElementById("taskInput");
            const statusList = document.getElementById("statusList");
            const resetAppBtn = document.getElementById("resetAppBtn");
            const notification = document.getElementById("notification");
            const sidebarTitle = document.getElementById("sidebarTitle");

            const STAGES = { ASK_NAME: 0, ASK_COUNT: 1, ASK_PROVIDERS: 2, ASK_API_KEYS: 3, READY: 4 };

            let appState = {
                stage: STAGES.ASK_NAME,
                userName: "",
                memberCount: 0,
                agents: [], 
                uniqueProvidersNeeded: [],
                apiKeys: {}, 
                setupIndices: { currentAgentIndex: 0, currentKeyIndex: 0 },
                chatHistory: [] 
            };

            let isAutoRunning = false;
            let totalMessageCounter = 0; // NEW: Tracks total AI responses for check-ins

            const savedState = localStorage.getItem("teamclubai_state");
            if (savedState) appState = JSON.parse(savedState);

            renderUIBasedOnStage();

            sendBtn.addEventListener("click", handleUserInput);
            stopBtn.addEventListener("click", () => { isAutoRunning = false; });
            
            [singleLineInput, passwordInput, taskInput].forEach(inputEl => {
                inputEl.addEventListener("keypress", (e) => {
                    if (e.key === "Enter" && !e.shiftKey) {
                        e.preventDefault();
                        handleUserInput();
                    }
                });
            });

            resetAppBtn.addEventListener("click", () => {
                if(confirm("Wipe all config?")) { localStorage.removeItem("teamclubai_state"); location.reload(); }
            });

            async function handleUserInput() {
                let activeInput = null;
                if (!singleLineInput.classList.contains("hidden")) activeInput = singleLineInput;
                else if (!passwordInput.classList.contains("hidden")) activeInput = passwordInput;
                else if (!taskInput.classList.contains("hidden")) activeInput = taskInput;

                const inputVal = activeInput.value.trim();
                if (!inputVal) return;
                activeInput.value = ""; 

                if (appState.stage !== STAGES.ASK_API_KEYS) {
                    addMessageToUI(appState.userName || "User", inputVal, "user");
                } else {
                    addMessageToUI(appState.userName || "User", "••••••••••••••••", "user");
                }

                switch (appState.stage) {
                    case STAGES.ASK_NAME:
                        appState.userName = inputVal;
                        appState.stage = STAGES.ASK_COUNT;
                        saveState();
                        setTimeout(() => {
                            addMessageToUI("System", `Welcome, **${appState.userName}**. How many models? (2-5)`, "system");
                            renderUIBasedOnStage();
                        }, 500);
                        break;

                    case STAGES.ASK_COUNT:
                        const count = parseInt(inputVal);
                        if (isNaN(count) || count < 2 || count > 5) {
                            setTimeout(() => addMessageToUI("System", "Enter 2-5.", "system"), 500);
                        } else {
                            appState.memberCount = count;
                            appState.stage = STAGES.ASK_PROVIDERS;
                            appState.setupIndices.currentAgentIndex = 0;
                            saveState();
                            setTimeout(() => askForNextProvider(), 500);
                        }
                        break;

                    case STAGES.ASK_PROVIDERS:
                        let providerID = "", providerName = "";
                        if (inputVal === "1") { providerID = "gemini"; providerName = "Google Gemini"; }
                        else if (inputVal === "2") { providerID = "openai"; providerName = "OpenAI"; }
                        else if (inputVal === "3") { providerID = "groq"; providerName = "Groq (Llama 3)"; }
                        else if (inputVal === "4") { providerID = "openrouter"; providerName = "OpenRouter"; }
                        else { return; }

                        appState.agents.push({ id: appState.setupIndices.currentAgentIndex + 1, provider: providerID, providerName: providerName });
                        appState.setupIndices.currentAgentIndex++;
                        
                        if (appState.setupIndices.currentAgentIndex < appState.memberCount) {
                            saveState();
                            setTimeout(() => askForNextProvider(), 500);
                        } else {
                            appState.uniqueProvidersNeeded = [...new Set(appState.agents.map(a => a.provider))];
                            appState.stage = STAGES.ASK_API_KEYS;
                            appState.setupIndices.currentKeyIndex = 0;
                            saveState();
                            setTimeout(() => askForNextKey(), 500);
                        }
                        break;

                    case STAGES.ASK_API_KEYS:
                        const currentProv = appState.uniqueProvidersNeeded[appState.setupIndices.currentKeyIndex];
                        appState.apiKeys[currentProv] = inputVal;
                        appState.setupIndices.currentKeyIndex++;
                        if (appState.setupIndices.currentKeyIndex < appState.uniqueProvidersNeeded.length) {
                            saveState();
                            setTimeout(() => askForNextKey(), 500);
                        } else {
                            appState.stage = STAGES.READY;
                            saveState();
                            setTimeout(() => {
                                addMessageToUI("System", `Ready! The agents will talk in a swarm. Every 5 messages, they will ask for your feedback.`, "system");
                                renderUIBasedOnStage();
                            }, 500);
                        }
                        break;

                    case STAGES.READY:
                        appState.chatHistory.push({ sender: appState.userName, text: inputVal });
                        saveState();
                        // Reset counter when user provides a new manual input
                        totalMessageCounter = 0;
                        await runInteractiveSwarm(inputVal);
                        break;
                }
            }

            function askForNextProvider() {
                addMessageToUI("System", `Agent ${appState.setupIndices.currentAgentIndex + 1} Provider:<br>1. Gemini | 2. OpenAI | 3. Groq | 4. OpenRouter`, "system");
                renderUIBasedOnStage();
            }

            function askForNextKey() {
                addMessageToUI("System", `Paste Key for **${appState.uniqueProvidersNeeded[appState.setupIndices.currentKeyIndex]}**:`, "system");
                renderUIBasedOnStage();
            }

            async function runInteractiveSwarm(task) {
                isAutoRunning = true;
                sendBtn.classList.add("hidden");
                stopBtn.classList.remove("hidden");
                taskInput.disabled = true;

                try {
                    let rollingContext = [];

                    while(isAutoRunning) {
                        for (let i = 0; i < appState.agents.length; i++) {
                            if (!isAutoRunning) break;

                            // CHECK-IN LOGIC: If we've hit 5 messages, pause and ask the user
                            if (totalMessageCounter > 0 && totalMessageCounter % 5 === 0) {
                                isAutoRunning = false;
                                addMessageToUI("System", `--- Loop Paused for Check-in ---`, "system");
                                addMessageToUI(appState.agents[i].providerName, `Hey **${appState.userName}**, we've discussed a few things. Is our conversation going right? Should we continue or change direction?`, `agent ${appState.agents[i].provider}`);
                                return; // Exit the loop and wait for manual user input
                            }

                            const agent = appState.agents[i];
                            const agentLabel = `Agent ${agent.id} (${agent.providerName})`;
                            const apiKey = appState.apiKeys[agent.provider];
                            
                            updateStatus(agent.id, "Generating...");

                            let systemPrompt = `You are ${agent.providerName}. You are in an autonomous swarm. Respond to the conversation history. Keep it concise. If you are the one asking for a check-in, ask ${appState.userName} if they are satisfied.`;
                            let contextString = rollingContext.join("\n\n");
                            let userPrompt = `Task: "${task}"\n\nRecent History:\n${contextString}\n\nYour turn.`;

                            const response = await callAIAPI(agent.provider, apiKey, userPrompt, systemPrompt);
                            if (!isAutoRunning) break;

                            addMessageToUI(agentLabel, response, `agent ${agent.provider}`);
                            appState.chatHistory.push({ sender: agentLabel, text: response, cssClass: `agent ${agent.provider}` });
                            totalMessageCounter++; // Increment counter
                            saveState();

                            rollingContext.push(`${agentLabel}: ${response}`);
                            if (rollingContext.length > 5) rollingContext.shift();
                            
                            updateStatus(agent.id, "Waiting");
                            await new Promise(res => setTimeout(res, 2000));
                        }
                    }
                } catch (error) {
                    showNotification(`Error: ${error.message}`, "error");
                } finally {
                    isAutoRunning = false;
                    stopBtn.classList.add("hidden");
                    sendBtn.classList.remove("hidden");
                    taskInput.disabled = false;
                }
            }

            async function callAIAPI(provider, apiKey, prompt, systemInstruction) {
                const maxTokens = 800;
                if (provider === "gemini") {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
                    const payload = { contents: [{ parts: [{ text: prompt }] }], systemInstruction: { parts: [{ text: systemInstruction }] }, generationConfig: { maxOutputTokens: maxTokens } };
                    const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
                    const data = await res.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text || "Error";
                } else {
                    let url = (provider === "openai") ? "https://api.openai.com/v1/chat/completions" : (provider === "groq") ? "https://api.groq.com/openai/v1/chat/completions" : "https://openrouter.ai/api/v1/chat/completions";
                    let model = (provider === "openai") ? "gpt-4o-mini" : (provider === "groq") ? "llama3-8b-8192" : "google/gemini-2.5-flash";
                    const res = await fetch(url, {
                        method: "POST",
                        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiKey}`, "HTTP-Referer": "https://AADI-playz23.github.io/Team-ClubAI/", "X-Title": "TeamClubAI" },
                        body: JSON.stringify({ model: model, max_tokens: maxTokens, messages: [{ role: "system", content: systemInstruction }, { role: "user", content: prompt }] })
                    });
                    const data = await res.json();
                    return data.choices[0].message.content;
                }
            }

            function renderUIBasedOnStage() {
                singleLineInput.classList.add("hidden"); passwordInput.classList.add("hidden"); taskInput.classList.add("hidden");
                if (appState.stage < 3) { singleLineInput.classList.remove("hidden"); singleLineInput.focus(); }
                else if (appState.stage === 3) { passwordInput.classList.remove("hidden"); passwordInput.focus(); }
                else { taskInput.classList.remove("hidden"); taskInput.focus(); renderSidebar(); }
                
                if (chatBox.children.length === 0 && appState.stage === 4) {
                    appState.chatHistory.forEach(msg => addMessageToUI(msg.sender, msg.text, msg.cssClass || "user"));
                }
            }

            function renderSidebar() {
                statusList.innerHTML = "";
                appState.agents.forEach(a => {
                    const li = document.createElement("li");
                    li.id = `agent-status-${a.id}`;
                    li.innerHTML = `🤖 <strong>Agent ${a.id}</strong> (${a.providerName})<br><span>Idle</span>`;
                    statusList.appendChild(li);
                });
            }

            function updateStatus(id, text) {
                const el = document.getElementById(`agent-status-${id}`);
                if (el) {
                    el.querySelector('span').innerText = text;
                    el.classList.toggle("active-agent", text === "Generating...");
                }
            }

            function resetAllStatuses() { appState.agents.forEach(a => updateStatus(a.id, "Idle")); }

            function showNotification(m, t) {
                notification.innerHTML = m; notification.style.display = "block";
                notification.style.color = t === "success" ? "var(--success)" : "var(--error)";
                setTimeout(() => notification.style.display = "none", 4000);
            }

            function saveState() { localStorage.setItem("teamclubai_state", JSON.stringify(appState)); }

            function addMessageToUI(sender, text, type) {
                const msgDiv = document.createElement("div");
                msgDiv.className = `message ${type}`;
                let formattedText = text.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>'); 
                msgDiv.innerHTML = `<strong>${sender}:</strong><br><br>${formattedText}`;
                chatBox.appendChild(msgDiv);
                chatBox.scrollTop = chatBox.scrollHeight; 
            }
        });
    </script>
</body>
</html>
