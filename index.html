<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamClubAI - Action Driven Swarm</title>
    <style>
        /* Dark Mode & Glassmorphism */
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: rgba(255,255,255,0.05); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
        .chat-box { height: 400px; overflow-y: auto; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .msg { margin-bottom: 10px; padding: 10px; border-radius: 6px; background: #1e293b; }
        .sys-msg { color: #3b82f6; font-style: italic; }
        input, button { padding: 12px; border-radius: 6px; border: none; margin-top: 10px; }
        input { width: calc(100% - 150px); background: #334155; color: white; }
        button { width: 130px; background: #3b82f6; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>

<div class="container">
    <h2>TeamClubAI Dashboard</h2>
    <div id="setup-panel">
        <p>To use the Free Tier (GitHub Actions + llama.cpp), enter your GitHub details:</p>
        <input type="text" id="gh-owner" placeholder="GitHub Username (e.g., aadi)">
        <input type="text" id="gh-repo" placeholder="Repository Name (e.g., TeamClubAI)">
        <input type="password" id="gh-token" placeholder="GitHub Personal Access Token (PAT)">
        <button onclick="saveSettings()">Save Settings</button>
    </div>

    <div class="chat-box" id="chat"></div>
    
    <div>
        <input type="text" id="prompt" placeholder="Assign a task to the swarm...">
        <button onclick="deploySwarm()">Deploy Swarm</button>
    </div>
</div>

<script>
    // 1. State Management
    let ghConfig = JSON.parse(localStorage.getItem('teamclub_gh')) || {};
    if(ghConfig.token) document.getElementById('setup-panel').style.display = 'none';

    function saveSettings() {
        ghConfig = {
            owner: document.getElementById('gh-owner').value,
            repo: document.getElementById('gh-repo').value,
            token: document.getElementById('gh-token').value
        };
        localStorage.setItem('teamclub_gh', JSON.stringify(ghConfig));
        document.getElementById('setup-panel').style.display = 'none';
        logMsg("System: GitHub configuration saved.", "sys-msg");
    }

    function logMsg(text, className = "msg") {
        const chat = document.getElementById('chat');
        chat.innerHTML += `<div class="${className}">${text}</div>`;
        chat.scrollTop = chat.scrollHeight;
    }

    // 2. Triggering the GitHub Action Backend
    async function dispatchGitHubAction(jobType, payload) {
        const jobId = Date.now().toString();
        logMsg(`System: Dispatching ${jobType} job to GitHub Actions... (ID: ${jobId})`, "sys-msg");

        const response = await fetch(`https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/actions/workflows/swarm-compute.yml/dispatches`, {
            method: "POST",
            headers: {
                "Accept": "application/vnd.github.v3+json",
                "Authorization": `token ${ghConfig.token}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                ref: "main",
                inputs: { job_type: jobType, prompt_or_code: payload, job_id: jobId }
            })
        });

        if (!response.ok) {
            logMsg(`Error triggering action: ${response.statusText}`);
            return null;
        }

        return await pollForResult(jobId);
    }

    // 3. Polling for the Result
    async function pollForResult(jobId) {
        logMsg(`System: Waiting for GitHub Runner to process and commit... (This takes 1-3 minutes)`, "sys-msg");
        
        // Poll every 15 seconds to see if the file exists in the raw GitHub content
        const url = `https://raw.githubusercontent.com/${ghConfig.owner}/${ghConfig.repo}/main/db/output_${jobId}.txt`;
        
        for (let i = 0; i < 20; i++) { // Max wait ~5 mins
            await new Promise(r => setTimeout(r, 15000)); 
            
            try {
                const res = await fetch(url + `?t=${Date.now()}`); // Cache bust
                if (res.ok) {
                    const data = await res.text();
                    return data;
                }
            } catch (e) {}
            console.log("Polling... attempt " + (i+1));
        }
        return "Error: Job timed out or runner failed.";
    }

    // 4. Main Swarm Execution
    async function deploySwarm() {
        const input = document.getElementById('prompt').value;
        if (!input) return;
        
        document.getElementById('prompt').value = '';
        logMsg(`User: ${input}`);

        // Call the Free Tier LLM (llama.cpp on GitHub Runner)
        const agentResponse = await dispatchGitHubAction('llm', `You are the Manager Agent. Break down this task: ${input}`);
        logMsg(`Manager Agent (Phi-3 via GitHub Actions):\n${agentResponse}`);
        
        // Example: If the agent wrote Python code, we could dispatch it again
        // const pythonResult = await dispatchGitHubAction('python', 'print("Hello from the cloud!")');
    }
</script>
</body>
</html>
